name: M3U Files Update

on:
  push:
    paths:
      - 'm3u_files/**/*.m3u'
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Generate M3U Index
        run: |
          echo "# YouTube M3U Kanal Listesi" > README.md
          echo "" >> README.md
          echo "Son yeniləmə: $(date)" >> README.md
          echo "" >> README.md
          echo "## 📺 Kanallar" >> README.md
          echo "" >> README.md
          
          for file in m3u_files/*.m3u; do
            if [ -f "$file" ]; then
              filename=$(basename "$file" .m3u)
              echo "- [$filename](https://raw.githubusercontent.com/${{ github.repository }}/main/$file)" >> README.md
            fi
          done
          
          echo "" >> README.md
          echo "---" >> README.md
          echo "✨ By_Kerimoff" >> README.md
          
      - name: Commit README
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add README.md
          git diff --quiet && git diff --staged --quiet || git commit -m "Update M3U index"
          git push
