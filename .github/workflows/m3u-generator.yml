name: YouTube M3U Generator

on:
  schedule:
    - cron: '0 */6 * * *'  # Hər 6 saatda
  workflow_dispatch:
  push:
    paths:
      - 'channels.json'

jobs:
  generate-m3u:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install yt-dlp
      run: |
        pip install --upgrade yt-dlp requests
    
    - name: Create directories
      run: mkdir -p m3u_files
    
    - name: Generate M3U files
      run: |
        python generate_m3u.py
      continue-on-error: true
    
    - name: Commit and push
      run: |
        git config user.name "GitHub Actions Bot"
        git config user.email "actions@github.com"
        git add m3u_files/ channels.json
        git diff --quiet && git diff --staged --quiet || git commit -m "Update M3U files [$(date +'%Y-%m-%d')]" || true
        git push
