name: YouTube M3U Generator

on:
  schedule:
    # Hər gün saat 00:00, 06:00, 12:00, 18:00-da işlə
    - cron: '0 */6 * * *'
  workflow_dispatch:  # Manual işlətmək üçün
  push:
    paths:
      - 'channels.json'  # JSON dəyişəndə işlə

jobs:
  generate-m3u:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install yt-dlp
      run: |
        pip install yt-dlp requests
    
    - name: Create m3u_files directory
      run: mkdir -p m3u_files
    
    - name: Generate M3U files from channels.json
      run: |
        python generate_m3u.py
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Commit and push changes
      run: |
        git config user.name "GitHub Actions"
        git config user.email "actions@github.com"
        git add m3u_files/
        git add channels.json
        git diff --quiet && git diff --staged --quiet || git commit -m "Auto-update M3U files [$(date +'%Y-%m-%d %H:%M:%S')]"
        git push
