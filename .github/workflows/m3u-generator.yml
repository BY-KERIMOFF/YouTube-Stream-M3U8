name: YouTube M3U Generator

on:
  schedule:
    - cron: '0 */3 * * *'  # Hər 3 saatda bir
  workflow_dispatch:
  push:
    paths:
      - 'channels.json'

jobs:
  generate-m3u:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        pip install --upgrade pip
        pip install yt-dlp requests
    
    - name: Install ffmpeg
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg
    
    - name: Test yt-dlp
      run: |
        yt-dlp --version
        yt-dlp -F https://www.youtube.com/watch?v=jfKfPfyJRdk --playlist-end 1
    
    - name: Create directories
      run: mkdir -p m3u_files
    
    - name: Generate M3U files
      run: |
        python generate_m3u.py
      env:
        PYTHONUNBUFFERED: 1
    
    - name: Commit and push changes
      run: |
        git config user.name "GitHub Actions Bot"
        git config user.email "actions@github.com"
        git add m3u_files/ channels.json
        git diff --quiet && git diff --staged --quiet || git commit -m "Auto-update M3U files [$(date +'%Y-%m-%d %H:%M:%S')]"
        git push
